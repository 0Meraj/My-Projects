<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PhishGuard</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #2b2b2f; --input-bg: #1a1a1e;
      --glass-bg: rgba(255,255,255,0.055); --glass-border: rgba(255,255,255,0.11);
      --glass-shine: rgba(255,255,255,0.035);
      --green-grad: linear-gradient(135deg, #74ee80, #1c7a30);
      --bubble-user: linear-gradient(135deg, #62de6e, #1c7a30);
      --bubble-sys: rgba(255,255,255,0.07); --bubble-sys-b: rgba(255,255,255,0.12);
      --text: #e0e0e8; --text-dim: #888898; --red: #ff4060; --green-tag: #42d96a;
      --panel-bg: #1a1a1e; --panel-border: rgba(255,255,255,0.09);
    }

    body {
      background: var(--bg); font-family: 'Inter', sans-serif;
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;
      overflow-x: hidden;
    }

    #landing { width: 100%; max-width: 500px; text-align: center; animation: fadeInUp 0.5s ease both; }

    .logo { display: flex; align-items: center; justify-content: center; gap: 11px; margin-bottom: 6px; }

    .tagline { color: var(--text-dim); font-size: 0.875rem; font-weight: 300; margin-bottom: 38px; }

    .input-row { display: flex; gap: 9px; }
    #url-input {
      flex: 1; background: var(--input-bg); border: 1px solid rgba(255,255,255,0.13);
      border-radius: 11px; padding: 13px 16px; color: var(--text);
      font-family: inherit; font-size: 0.9rem; font-weight: 300; outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    #url-input::placeholder { color: var(--text-dim); }
    #url-input:focus { border-color: rgba(255,255,255,0.3); box-shadow: 0 0 0 3px rgba(255,255,255,0.04); }

    .btn-analyze {
      background: var(--green-grad); border: none; border-radius: 11px;
      padding: 13px 22px; color: #fff; font-family: inherit; font-size: 0.9rem;
      font-weight: 600; cursor: pointer; white-space: nowrap;
      transition: opacity 0.2s, transform 0.12s; box-shadow: 0 4px 20px rgba(74,238,128,0.18);
    }
    .btn-analyze:hover { opacity: 0.88; }
    .btn-analyze:active { transform: scale(0.96); }

    /* ── Chat screen wrapper ── */
    #chat-screen { display: none; width: 100%; max-width: 620px; flex-direction: column; height: 90vh; max-height: 760px; position: relative; }

    .report-btn {
      background: rgba(255,255,255,0.06); border: 1px solid var(--panel-border);
      border-radius: 8px; padding: 6px 12px; color: var(--text-dim);
      font-family: inherit; font-size: 0.75rem; font-weight: 500;
      cursor: pointer; transition: background 0.2s, color 0.2s; white-space: nowrap;
      display: flex; align-items: center; gap: 6px; align-self: flex-end; margin-bottom: 10px;
    }
    .report-btn:hover { background: rgba(255,255,255,0.1); color: var(--text); }
    .report-btn svg { width: 12px; height: 12px; fill: currentColor; }

    .chat-window {
      flex: 1; background: var(--glass-bg); backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px); border: 1px solid var(--glass-border);
      border-radius: 22px; padding: 22px 18px; overflow-y: auto;
      display: flex; flex-direction: column; gap: 12px; position: relative;
      box-shadow: 0 10px 50px rgba(0,0,0,0.38), inset 0 1px 0 var(--glass-shine);
    }
    .chat-window::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 45%;
      border-radius: 22px 22px 0 0;
      background: linear-gradient(180deg, rgba(255,255,255,0.04), transparent);
      pointer-events: none;
    }
    .chat-window::-webkit-scrollbar { width: 3px; }
    .chat-window::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 4px; }

    .bubble-row { display: flex; opacity: 0; }
    .bubble-row.user   { justify-content: flex-end; }
    .bubble-row.system { justify-content: flex-start; }
    .bubble-row.visible { animation: bubblePop 0.32s cubic-bezier(0.34,1.56,0.64,1) both; }

    .bubble { max-width: 76%; padding: 11px 14px; font-size: 0.875rem; line-height: 1.55; border-radius: 18px; }
    .bubble-row.user .bubble {
      background: var(--bubble-user); color: #fff; font-weight: 500;
      border-bottom-right-radius: 5px; word-break: break-all;
      box-shadow: 0 3px 14px rgba(74,238,128,0.15);
    }
    .bubble-row.system .bubble {
      background: var(--bubble-sys); border: 1px solid var(--bubble-sys-b);
      color: var(--text); border-bottom-left-radius: 5px;
    }

    .verdict-label       { font-size: 1rem; font-weight: 600; margin-bottom: 2px; }
    .verdict-label.phishing  { color: var(--red); }
    .verdict-label.legit     { color: var(--green-tag); }
    .verdict-explanation { font-size: 0.835rem; color: var(--text-dim); line-height: 1.6; font-weight: 300; }

    /* Flag chips */
    .flags-header {
      font-size: 0.72rem; font-weight: 600; letter-spacing: 0.08em;
      text-transform: uppercase; color: var(--text-dim); margin-bottom: 9px;
    }
    .flag-chip {
      display: flex; align-items: flex-start; gap: 8px;
      padding: 7px 10px; margin-bottom: 6px;
      background: rgba(255, 64, 96, 0.08); border: 1px solid rgba(255, 64, 96, 0.2);
      border-radius: 9px; font-size: 0.825rem; color: var(--text); line-height: 1.4;
    }
    .flag-chip:last-child { margin-bottom: 0; }
    .flag-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--red); flex-shrink: 0; margin-top: 5px;
      box-shadow: 0 0 6px rgba(255,64,96,0.5);
    }

    /* Caution bubble */
    .caution-text {
      font-size: 0.855rem; color: var(--text-dim); line-height: 1.6; font-weight: 300;
    }
    .caution-text strong { color: var(--text); font-weight: 500; }

    .typing-indicator { display: flex; gap: 5px; align-items: center; padding: 13px 16px; }
    .typing-indicator span {
      width: 7px; height: 7px; background: var(--text-dim);
      border-radius: 50%; animation: typingDot 1.1s infinite;
    }
    .typing-indicator span:nth-child(2) { animation-delay: 0.18s; }
    .typing-indicator span:nth-child(3) { animation-delay: 0.36s; }

    .chat-input-area { padding: 14px 4px 0; }
    .confidence-bar {
      display: flex; align-items: center; gap: 10px; background: var(--input-bg);
      border: 1px solid rgba(255,255,255,0.13); border-radius: 12px;
      padding: 11px 13px; cursor: pointer; user-select: none;
      transition: border-color 0.2s, background 0.2s;
    }
    .confidence-bar:hover { border-color: rgba(255,255,255,0.26); background: #202024; }
    .confidence-bar.sent  { opacity: 0.35; pointer-events: none; }
    .confidence-bar-text  { flex: 1; color: var(--text-dim); font-size: 0.86rem; font-weight: 300; }

    .send-btn {
      width: 30px; height: 30px; background: var(--green-grad); border: none;
      border-radius: 8px; display: flex; align-items: center; justify-content: center;
      cursor: pointer; flex-shrink: 0; box-shadow: 0 2px 10px rgba(74,238,128,0.18);
    }
    .send-btn svg { width: 13px; height: 13px; fill: #fff; }

    /* ══════════════════════════
       SIDE PANEL
    ══════════════════════════ */
    #report-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.45); z-index: 100;
      backdrop-filter: blur(2px);
    }
    #report-overlay.open { display: block; animation: fadeBg 0.25s ease both; }

    #report-panel {
      position: fixed; top: 0; right: 0; height: 100vh; width: 420px; max-width: 95vw;
      background: var(--panel-bg); border-left: 1px solid var(--panel-border);
      z-index: 101; display: flex; flex-direction: column;
      transform: translateX(100%); transition: transform 0.3s cubic-bezier(0.4,0,0.2,1);
      box-shadow: -10px 0 40px rgba(0,0,0,0.4);
    }
    #report-panel.open { transform: translateX(0); }

    .panel-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 20px 22px; border-bottom: 1px solid var(--panel-border);
      flex-shrink: 0;
    }
    .panel-header h3 { font-size: 0.95rem; font-weight: 600; color: var(--text); }
    .panel-header p  { font-size: 0.72rem; color: var(--text-dim); margin-top: 2px; }

    .panel-close {
      width: 28px; height: 28px; background: rgba(255,255,255,0.06);
      border: none; border-radius: 6px; color: var(--text-dim);
      font-size: 1rem; cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: background 0.2s;
    }
    .panel-close:hover { background: rgba(255,255,255,0.12); }

    .panel-body { flex: 1; overflow-y: auto; padding: 22px; }
    .panel-body::-webkit-scrollbar { width: 3px; }
    .panel-body::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 4px; }

    .metric-section { margin-bottom: 28px; }
    .metric-section-title {
      font-size: 0.7rem; font-weight: 600; letter-spacing: 0.1em;
      text-transform: uppercase; color: var(--text-dim); margin-bottom: 10px;
    }

    .report-table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
    .report-table th {
      text-align: left; padding: 7px 10px; color: var(--text-dim);
      font-weight: 500; font-size: 0.7rem; text-transform: uppercase;
      letter-spacing: 0.06em; border-bottom: 1px solid rgba(255,255,255,0.07);
    }
    .report-table td { padding: 9px 10px; color: var(--text); border-bottom: 1px solid rgba(255,255,255,0.04); }
    .report-table tr:last-child td { border-bottom: none; }
    .report-table td:first-child { color: var(--text-dim); font-weight: 500; }

    .panel-loading { color: var(--text-dim); font-size: 0.875rem; padding: 40px 0; text-align: center; }
    .panel-error   { color: var(--red); font-size: 0.875rem; padding: 40px 0; text-align: center; }

    @keyframes fadeInUp  { from { opacity:0; transform:translateY(14px); } to { opacity:1; transform:translateY(0); } }
    @keyframes fadeOut   { to   { opacity:0; transform:translateY(-10px); } }
    @keyframes bubblePop { from { opacity:0; transform:scale(0.86) translateY(8px); } to { opacity:1; transform:scale(1) translateY(0); } }
    @keyframes typingDot { 0%,60%,100% { transform:translateY(0); opacity:0.35; } 30% { transform:translateY(-5px); opacity:1; } }
    @keyframes fadeBg    { from { opacity:0; } to { opacity:1; } }
  </style>
</head>
<body>

  <div id="landing">
    <div class="logo">
      <img src="{{ url_for('static', filename='phishing_logo.png') }}" alt="PhishGuard logo" style="width:300px;height:auto;"/>
    </div>
    <p class="tagline">Paste any URL and let the system analyse it for threats.</p>
    <form id="scan-form" method="POST" onsubmit="handleSubmit(event)">
      <div class="input-row">
        <input id="url-input" type="url" name="url" placeholder="https://example.com/login"
          required autocomplete="off" spellcheck="false" value="{{ submitted_url }}"/>
        <button class="btn-analyze" type="submit">Analyse</button>
      </div>
    </form>
  </div>

  <div id="chat-screen">
    <button class="report-btn" onclick="openReport()">
      <svg viewBox="0 0 24 24"><path d="M9 17H7v-7h2v7zm4 0h-2V7h2v10zm4 0h-2v-4h2v4zM5 21h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v14a2 2 0 002 2z"/></svg>
      Technical Report
    </button>

    <div class="chat-window" id="chat-window"></div>
    <div class="chat-input-area">
      <div class="confidence-bar" id="confidence-bar" onclick="sendConfidenceQuery()">
        <span class="confidence-bar-text">How confident are you in this assessment?</span>
        <button class="send-btn"><svg viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg></button>
      </div>
    </div>
  </div>

  <div id="report-overlay" onclick="closeReport()"></div>

  <div id="report-panel">
    <div class="panel-header">
      <div>
        <h3>Technical Report</h3>
      </div>
      <button class="panel-close" onclick="closeReport()">✕</button>
    </div>
    <div class="panel-body" id="panel-body">
      <p class="panel-loading">Loading report...</p>
    </div>
  </div>

  <script>
    const RESULT        = {{ result | tojson if result else 'null' }};
    const SUBMITTED_URL = {{ submitted_url | tojson }};
    const wait          = ms => new Promise(r => setTimeout(r, ms));

    if (RESULT && SUBMITTED_URL) {
      document.getElementById('landing').style.display = 'none';
      document.getElementById('chat-screen').style.display = 'flex';
      runChatSequence(SUBMITTED_URL, RESULT);
    }

    function handleSubmit(e) {
      e.preventDefault();
      document.getElementById('landing').style.animation = 'fadeOut 0.3s ease forwards';
      setTimeout(() => e.target.submit(), 280);
    }

    function appendBubble(side, html) {
      const win = document.getElementById('chat-window');
      const row = document.createElement('div');
      row.className = `bubble-row ${side}`;
      const bub = document.createElement('div');
      bub.className = 'bubble';
      bub.innerHTML = html;
      row.appendChild(bub);
      win.appendChild(row);
      win.scrollTop = win.scrollHeight;
      requestAnimationFrame(() => requestAnimationFrame(() => row.classList.add('visible')));
    }

    function showTyping() {
      const win = document.getElementById('chat-window');
      const row = document.createElement('div');
      row.className = 'bubble-row system'; row.id = 'typing';
      const bub = document.createElement('div');
      bub.className = 'bubble typing-indicator';
      bub.innerHTML = '<span></span><span></span><span></span>';
      row.appendChild(bub); win.appendChild(row); win.scrollTop = win.scrollHeight;
    }

    function removeTyping() { const el = document.getElementById('typing'); if (el) el.remove(); }

    async function runChatSequence(url, result) {
      const isPhishing = result.label === 'PHISHING';

      await wait(350);
      appendBubble('user', esc(url));
      await wait(650); showTyping(); await wait(1150); removeTyping();

      if (isPhishing) {
        // Bubble 1: verdict
        appendBubble('system', `
          <div class="verdict-label phishing">⚠ PHISHING DETECTED</div>
          <div class="verdict-explanation">This URL has been flagged as a phishing attempt.</div>
        `);

        // Bubble 2: top flags
        await wait(500); showTyping(); await wait(900); removeTyping();
        const flags = result.flags || [];
        const chipsHtml = flags.length
          ? flags.map(f => `
              <div class="flag-chip">
                <div class="flag-dot"></div>
                <span>${esc(f)}</span>
              </div>`).join('')
          : '<div class="verdict-explanation">No specific heuristics flagged.</div>';

        appendBubble('system', `
          <div class="flags-header">Top indicators</div>
          ${chipsHtml}
        `);

        // Bubble 3: caution advice
        await wait(500); showTyping(); await wait(850); removeTyping();
        appendBubble('system', `
          <div class="caution-text">
            <strong>Do not proceed.</strong> Avoid entering any personal information, credentials, or payment details on this page. If you received this link via email or message, it is likely a phishing attempt.
          </div>
        `);

      } else {
        // Legit — original single bubble
        appendBubble('system', `
          <div class="verdict-label legit">✓ LEGITIMATE</div>
          <div class="verdict-explanation">This URL does not contain strong phishing indicators and appears structurally normal.</div>
        `);
      }
    }

    async function sendConfidenceQuery() {
      document.getElementById('confidence-bar').classList.add('sent');
      appendBubble('user', 'How confident are you in this assessment?');
      await wait(550); showTyping(); await wait(1050); removeTyping();
      const p = RESULT && RESULT.label === 'PHISHING';
      const tone = p ? 'This URL shows strong phishing indicators — exercise caution.'
                     : 'The URL appears structurally normal with no significant phishing signals.';
      appendBubble('system', `The system is <strong style="color:#e0e0e8">${esc(String(RESULT.confidence))}%</strong> confident. ${esc(tone)}`);
    }

    // ── Report panel ──
    let reportLoaded = false;

    async function openReport() {
      document.getElementById('report-overlay').classList.add('open');
      document.getElementById('report-panel').classList.add('open');
      if (reportLoaded) return;
      try {
        const res  = await fetch('/report');
        const data = await res.json();
        if (data.error) throw new Error(data.error);
        renderReport(data);
        reportLoaded = true;
      } catch (err) {
        document.getElementById('panel-body').innerHTML =
          `<p class="panel-error">${esc(err.message)}</p>`;
      }
    }

    function closeReport() {
      document.getElementById('report-overlay').classList.remove('open');
      document.getElementById('report-panel').classList.remove('open');
    }

    function fmt(val) { return (typeof val === 'number') ? (val * 100).toFixed(1) + '%' : '—'; }

    function renderReport(d) {
      const phishing  = d['1']  || d['phishing']  || {};
      const legit     = d['0']  || d['legitimate'] || {};
      const macro     = d['macro avg'] || {};
      const weighted  = d['weighted avg'] || {};

      const rows = [
        ['Legitimate (0)', legit],
        ['Phishing (1)',   phishing],
        ['Macro Avg',      macro],
        ['Weighted Avg',   weighted],
      ];

      const tableRows = rows.map(([label, m]) => `
        <tr>
          <td>${label}</td>
          <td>${fmt(m.precision)}</td>
          <td>${fmt(m.recall)}</td>
          <td>${fmt(m['f1-score'])}</td>
          <td>${m.support != null ? Math.round(m.support) : '—'}</td>
        </tr>`).join('');

      document.getElementById('panel-body').innerHTML = `
        <div class="metric-section">
          <div class="metric-section-title">Per-Class Breakdown</div>
          <table class="report-table">
            <thead>
              <tr>
                <th>Class</th><th>Precision</th><th>Recall</th><th>F1</th><th>Support</th>
              </tr>
            </thead>
            <tbody>${tableRows}</tbody>
          </table>
        </div>`;
    }

    function esc(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }
  </script>
</body>
</html>
