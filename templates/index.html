<!DOCTYPE html>
<html>
<head>
    <title>Phishing Detector</title>
    <style>
        body {
            background:#1c1c1d;
            color:white;
            font-family:Arial;
            height:100vh;
            margin:0;
            display:flex;
            align-items:center;
            justify-content:center;
        }

        .container {
            text-align:center;
            max-width:700px;
        }

        input {
            padding:10px;
            width:420px;
            border-radius:6px;
            border:none;
        }

        button {
            margin-top:10px;
            padding:10px 20px;
            border:none;
            border-radius:6px;
            background:#238636;
            color:white;
            cursor:pointer;
        }

        .system-report-btn {
            position:fixed;
            top:20px;
            right:20px;
            z-index:1000;
        }

        .modal {
            display:none;
            position:fixed;
            inset:0;
            background:rgba(0,0,0,0.7);
            align-items:center;
            justify-content:center;
        }

        .modal-content {
            background:#111;
            padding:20px;
            border-radius:8px;
            width:600px;
            max-height:70vh;
            overflow-y:auto;
        }

        table {
            width:100%;
            border-collapse:collapse;
        }

        td {
            padding:8px;
            border-bottom:1px solid #333;
            text-align:left;
        }

        .confidence {
            display:none;
            margin-top:10px;
        }
    </style>
</head>

<body>

<div class="container">
    <h1>Phishing Detector</h1>

    <form method="POST">
        <input type="url" name="url" placeholder="Paste a URL" required>
        <br>
        <button type="submit">Analyse</button>
    </form>

    {% if result %}
        <h2 style="margin-top:20px;">{{ result.label }}</h2>

        <p style="margin-top:15px; line-height:1.5;">
            {{ result.explanation }}
        </p>

        <button onclick="toggleConfidence()">What is the confidence of this assessment?</button>

        <p class="confidence" id="confidence">
            The system is {{ result.confidence }}% confident in this assessment.
        </p>
    {% endif %}
</div>

<script>
function openModal() {
    document.getElementById("modal").style.display = "flex";
}

function closeModal() {
    document.getElementById("modal").style.display = "none";
}

function toggleConfidence() {
    const el = document.getElementById("confidence");
    el.style.display = el.style.display === "none" ? "block" : "none";
}
</script>

</body>
</html>
